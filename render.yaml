services:
  - type: web
    name: shuroku-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: none
      - key: JWT_SECRET
        generateValue: true        # Render generates a long random secret
      - key: DATABASE_URL
        sync: false                # set manually: your Neon connection string
      - key: CORS_ORIGIN
        sync: false                # set manually: your Vercel URL, after first deploy
