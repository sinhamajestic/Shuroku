services:
  - type: web
    name: shuroku-backend
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev forces devDependencies (typescript, @types/node) during build,
    # which NODE_ENV=production would otherwise skip. Runtime stays production.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: none
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
